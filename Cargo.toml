[package]
name = "duckdb_hudi"
version = "0.1.0"
edition = "2021"
description = "DuckDB extension for scanning Apache Hudi tables, built on hudi-rs"
license = "MIT"
repository = "https://github.com/oglego/duckdb-hudi"
readme = "README.md"

# The extension-ci-tools Makefiles expect the library to be named after the extension
# (`libhudi.so` / `libhudi.dylib` / `hudi.dll`), so the lib name differs from the package name.
[lib]
name = "hudi"
crate-type = ["cdylib"]

[profile.release]
lto = true
strip = true

[dependencies]
duckdb = { version = "~1.10503.1", features = ["loadable-extension"] }
# Renamed so it does not clash with this crate's own lib name (`hudi`).
hudi_rs = { package = "hudi", git = "https://github.com/apache/hudi-rs", rev = "3abc4d5172434d58071ea8cd0ca5b6dbb5e191c7" }
tokio = { version = "1", features = ["rt-multi-thread"] }
futures = "0.3"
url = "2"
vcpkg = "0.2.15"
